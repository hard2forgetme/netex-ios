name: NetexIOS
options:
  bundleIdPrefix: io.github.hard2forgetme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  NetexIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/NetexIOS
      - path: Assets.xcassets
      - path: Resources/NetexAssets
        type: folder
        buildPhase: resources
    info:
      path: Sources/NetexIOS/Info.plist
      properties:
        CFBundleDisplayName: Netex iOS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hard2forgetme.netexios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NetexIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NetexIOSTests
    dependencies:
      - target: NetexIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hard2forgetme.netexios.tests
  NetexIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NetexIOSUITests
    dependencies:
      - target: NetexIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hard2forgetme.netexios.uitests
